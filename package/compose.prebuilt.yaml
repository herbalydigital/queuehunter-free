name: queuehunter-onprem
services:
  api:
    image: queuehunter-api:qh-629b7245cc49-free
    env_file:
      - .env
    environment:
      API_PORT: "8000"
      MAX_PAYLOAD_SIZE_MB: ${MAX_PAYLOAD_SIZE_MB:-10}
      LICENSE_DATA_DIR: /var/lib/queuehunter
      QUEUEHUNTER_DB_PATH: /var/lib/queuehunter/messages.db
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:-${RABBITMQ_URL:-}}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_DOCKER_BOOTSTRAP_SERVERS:-${KAFKA_BOOTSTRAP_SERVERS:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - queuehunter-data:/var/lib/queuehunter
      - ./certs:/run/certs:ro
    expose:
      - "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    image: queuehunter-web:qh-629b7245cc49
    command: ["nginx", "-c", "/tmp/nginx.conf", "-g", "daemon off;"]
    environment:
      MAX_PAYLOAD_SIZE_MB: ${MAX_PAYLOAD_SIZE_MB:-10}
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      NGINX_ENVSUBST_FILTER: MAX_PAYLOAD_SIZE_MB
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT:-5173}:80"
    restart: unless-stopped
    read_only: true
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/payload-too-large.json:/usr/share/nginx/html/queuehunter-payload-too-large.json:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  queuehunter-data:
